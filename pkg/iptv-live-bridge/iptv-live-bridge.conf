# IPTV Live Bridge Configuration File
# Location: /etc/iptv-live-bridge.conf or local iptv-live-bridge.conf

# Network listen settings:
# Can be specified as combined BRIDGE_ADDR, or separate BRIDGE_HOST & BRIDGE_PORT
# Examples:
#   BRIDGE_ADDR=[fd00:2830::7555]:8080   (IPv6 loopback on port 8080)
#   BRIDGE_ADDR=127.0.0.1:8080          (IPv4 loopback on port 8080)
#   BRIDGE_ADDR=:8080                   (all interfaces on port 8080)
BRIDGE_HOST=fd00:2830::7555
BRIDGE_PORT=8080
BRIDGE_ADDR=[fd00:2830::7555]:8080

# Media directory paths
# BRIDGE_MEDIA_DIR=/var/lib/iptv-live-bridge

# Stream quality preference: best, 1080p, 720p, 480p, worst
BRIDGE_QUALITY=best

# In-memory playlist cache TTL in seconds
BRIDGE_CACHE_TTL=30
