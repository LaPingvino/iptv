name: Build & Validate IPTV Playlists

on:
  schedule:
    # Run every Sunday at 04:00 UTC to refresh EPG & check stream health
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Playlist Generator & Fetch EPG
        run: |
          python src/builder.py

      - name: Validate Public Streams
        run: |
          python src/validator.py --workers 16

      - name: Commit and push updated EPG & playlists if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes in generated files."
          else
            git commit -m "Weekly refresh: IPTV playlists & EPG data [skip ci]"
            git push
          fi
